services:
  - type: web
    name: informes-app
    # Docker para poder instalar LibreOffice (conversión a PDF). Ver Dockerfile.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_USUARIO
        value: ffica
